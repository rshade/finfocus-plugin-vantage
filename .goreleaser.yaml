version: 2

project_name: finfocus-plugin-vantage

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: finfocus-plugin-vantage
    main: ./cmd/finfocus-plugin-vantage
    binary: finfocus-plugin-vantage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{.Version}}

archives:
  - id: archive
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/*.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

release:
  github:
    owner: rshade
    name: finfocus-plugin-vantage
  name_template: '{{ .ProjectName }} v{{ .Version }}'
  footer: |
    ### Verification

    All binaries include checksums provided in `checksums.txt`.

    ```bash
    # Verify checksum (example for Linux amd64)
    sha256sum -c checksums.txt --ignore-missing
    ```

    ### Installation

    Download the appropriate binary for your platform from the assets below.

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
